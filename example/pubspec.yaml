name: notes_example
description: Android/iOS example notes app demonstrating network_monitoring with a local JWT API server.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  equatable: ^2.0.5
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.0
  dart_jsonwebtoken: ^3.2.0
  network_monitoring:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
