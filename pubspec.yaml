name: network_monitoring
description: Simple Package for Real-time HTTP network monitoring for Flutter apps with breakpoints, dev mode, and a floating overlay.
version: 1.0.1
homepage: https://github.com/omarfaroke/network_monitoring
repository: https://github.com/omarfaroke/network_monitoring
issue_tracker: https://github.com/omarfaroke/network_monitoring/issues
topics:
  - dio
  - network
  - monitoring
  - debug
  - dev-mode

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  dio: ^5.9.0
  share_plus: ^12.0.1
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
